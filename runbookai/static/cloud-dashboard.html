<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RunbookAI Cloud Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            background: white;
            border-radius: 8px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 10px;
            color: #667eea;
        }

        .header p {
            color: #666;
            font-size: 14px;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        @media (max-width: 768px) {
            .grid {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background: white;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .card h2 {
            font-size: 16px;
            margin-bottom: 15px;
            color: #333;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 2px solid #f0f0f0;
            padding-bottom: 10px;
        }

        .stat {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #f0f0f0;
        }

        .stat:last-child {
            border-bottom: none;
        }

        .stat-label {
            color: #666;
            font-size: 14px;
        }

        .stat-value {
            font-size: 24px;
            font-weight: bold;
            color: #667eea;
        }

        .agent-status {
            padding: 15px;
            border-radius: 4px;
            margin: 10px 0;
        }

        .agent-status.online {
            background: #e8f5e9;
            border-left: 4px solid #4caf50;
        }

        .agent-status.offline {
            background: #fff3e0;
            border-left: 4px solid #ff9800;
        }

        .agent-status.error {
            background: #ffebee;
            border-left: 4px solid #f44336;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
            margin: 5px 0;
        }

        .status-badge.online {
            background: #4caf50;
            color: white;
        }

        .status-badge.offline {
            background: #ff9800;
            color: white;
        }

        .status-badge.error {
            background: #f44336;
            color: white;
        }

        .incidents-list {
            list-style: none;
        }

        .incident-item {
            padding: 15px;
            border: 1px solid #f0f0f0;
            border-radius: 4px;
            margin-bottom: 10px;
            background: #fafafa;
        }

        .incident-item:hover {
            background: #f5f5f5;
        }

        .incident-name {
            font-weight: bold;
            color: #333;
            margin-bottom: 5px;
        }

        .incident-meta {
            font-size: 12px;
            color: #999;
            display: flex;
            gap: 15px;
        }

        .empty {
            text-align: center;
            color: #999;
            padding: 30px;
            font-style: italic;
        }

        .error-message {
            background: #ffebee;
            border: 1px solid #f44336;
            color: #c62828;
            padding: 15px;
            border-radius: 4px;
            margin-bottom: 20px;
        }

        .loading {
            text-align: center;
            padding: 30px;
            color: #999;
        }

        .loading::after {
            content: " ...";
            animation: dots 1.5s steps(4, end) infinite;
        }

        @keyframes dots {
            0%, 20% { content: " "; }
            40% { content: " ."; }
            60% { content: " .."; }
            80%, 100% { content: " ..."; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>RunbookAI Cloud Dashboard</h1>
            <p>Incident Response & Agent Status</p>
        </div>

        <div id="content">
            <div class="loading">Loading dashboard</div>
        </div>
    </div>

    <script>
        // Extract API key from URL or localStorage
        function getApiKey() {
            const urlParams = new URLSearchParams(window.location.search);
            const apiKey = urlParams.get('api_key') || localStorage.getItem('runbookai_api_key');
            if (!apiKey) {
                showError('API key not provided. Use: ?api_key=sk_...');
                return null;
            }
            return apiKey;
        }

        function showError(msg) {
            document.getElementById('content').innerHTML = `<div class="error-message">${msg}</div>`;
        }

        async function loadDashboard() {
            const apiKey = getApiKey();
            if (!apiKey) return;

            try {
                // First, get current customer info from API (need to enhance this)
                // For now, we'll load generic dashboard
                const response = await fetch('/health', {
                    headers: {
                        'X-API-Key': apiKey,
                    },
                });

                if (!response.ok) {
                    showError('Failed to load dashboard. Check your API key.');
                    return;
                }

                // Build dashboard HTML
                renderDashboard();
            } catch (e) {
                showError(`Error: ${e.message}`);
            }
        }

        function renderDashboard() {
            const html = `
                <div class="grid">
                    <div class="card">
                        <h2>Agent Status</h2>
                        <div class="agent-status online">
                            <div class="status-badge online">ONLINE</div>
                            <div style="margin-top: 10px; font-size: 14px; color: #333;">
                                <strong>prod-agent-01</strong><br>
                                <small>Last heartbeat: just now</small>
                            </div>
                        </div>
                    </div>

                    <div class="card">
                        <h2>Statistics (30 Days)</h2>
                        <div class="stat">
                            <span class="stat-label">Total Incidents</span>
                            <span class="stat-value">42</span>
                        </div>
                        <div class="stat">
                            <span class="stat-label">Resolved</span>
                            <span class="stat-value" style="color: #4caf50;">38</span>
                        </div>
                        <div class="stat">
                            <span class="stat-label">Pending</span>
                            <span class="stat-value" style="color: #ff9800;">3</span>
                        </div>
                        <div class="stat">
                            <span class="stat-label">Escalated</span>
                            <span class="stat-value" style="color: #f44336;">1</span>
                        </div>
                        <div class="stat">
                            <span class="stat-label">Avg Resolution Time</span>
                            <span class="stat-value" style="color: #667eea;">15m 30s</span>
                        </div>
                    </div>
                </div>

                <div class="card">
                    <h2>Recent Incidents</h2>
                    <ul class="incidents-list">
                        <li class="incident-item">
                            <div class="incident-name">High CPU on prod-api-01</div>
                            <div class="incident-meta">
                                <span>Status: <strong style="color: #4caf50;">Resolved</strong></span>
                                <span>Source: datadog</span>
                                <span>2 hours ago</span>
                            </div>
                        </li>
                        <li class="incident-item">
                            <div class="incident-name">Database connection pool exhausted</div>
                            <div class="incident-meta">
                                <span>Status: <strong style="color: #4caf50;">Resolved</strong></span>
                                <span>Source: generic</span>
                                <span>1 day ago</span>
                            </div>
                        </li>
                        <li class="incident-item">
                            <div class="incident-name">Disk usage > 90%</div>
                            <div class="incident-meta">
                                <span>Status: <strong style="color: #ff9800;">Pending</strong></span>
                                <span>Source: grafana</span>
                                <span>3 days ago</span>
                            </div>
                        </li>
                    </ul>
                </div>

                <div style="text-align: center; margin-top: 30px; color: white; font-size: 12px;">
                    <p>Powered by RunbookAI Cloud | Phase 3 Beta</p>
                </div>
            `;
            document.getElementById('content').innerHTML = html;
        }

        // Load dashboard on page load
        window.addEventListener('load', loadDashboard);
    </script>
</body>
</html>
